<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24. Ana Başlık | Finans Akademisi</title><style>body{font:16px/1.65 system-ui,sans-serif;max-width:850px;margin:auto;padding:20px;color:#17222b;background:#f7f9fb}article,header{background:white;padding:22px;border:1px solid #dde4ea;border-radius:14px;margin:16px 0}h1{line-height:1.2}h2{margin-bottom:8px}h3{margin-bottom:4px}textarea{box-sizing:border-box;width:100%;min-height:90px;padding:10px;border:1px solid #abb7c4;border-radius:8px}button{padding:10px 16px;border-radius:8px;border:1px solid #597184;background:white;cursor:pointer;margin:6px 4px 6px 0}button.primary{background:#14684d;color:white;border:0}.muted{color:#526171}details{margin:12px 0;border-top:1px solid #e5e9ed;padding-top:10px}label{display:block;margin:8px 0}nav a{color:#14684d}small{color:#526171}</style></head><body><header><nav><a href="./index.html">← Akademiye dön</a></nav><h1>24. Ana Başlık — Finansal Etik, Kurumsal Yönetim ve Sürdürülebilir Finans</h1><p>5. Aşama · 20 ders · 100 açıklamalı soru · 20 ödev. Bu bölüm, sohbet içeriğinden uygulama için düzenlenmiş ilk sürümdür; uzun metinlerin bire bir arşivi değildir.</p><p id="progress"></p></header><main id="lessons"></main><script>const data=[{"id":"stage5-24-1","title":"Finansal Etiğin Temelleri","body":"Finansal etik; dürüstlük, adalet, şeffaflık, gizlilik, yetkinlik ve çıkar çatışmalarının yönetimini gerektirir. Yasal bir davranış etik açıdan yine de sorunlu olabilir. Müşterinin yararını gözetmek, riskleri anlaşılır açıklamak ve komisyon kaynaklı yönlendirmelerden kaçınmak gerekir.","example":"Müşteriye uygun A ürünü 500 TL, uygun olmayan B ürünü 2.000 TL komisyon sağlıyorsa yüksek komisyon tek başına B önerisini haklı kılmaz.","source":"CFA Institute etik standartları","homework":"Finansal Etiğin Temelleri konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Etik ilke nedir?","a":"Dürüstlük, adalet ve sorumluluk.","why":"Finansal etik; dürüstlük, adalet, şeffaflık, gizlilik, yetkinlik ve çıkar çatışmalarının yönetimini gerektirir."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Müşteriye uygun A ürünü 500 TL, uygun olmayan B ürünü 2.000 TL komisyon sağlıyorsa yüksek komisyon tek başına B önerisini haklı kılmaz.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Finansal etik; dürüstlük, adalet, şeffaflık, gizlilik, yetkinlik ve çıkar çatışmalarının yönetimini gerektirir. Yasal bir davranış etik açıdan yine de sorunlu olabilir. Müşterinin yararını gözetmek, riskleri anlaşılır açıklamak ve komisyon kaynaklı yönlendirmelerden kaçınmak gerekir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Finansal Etiğin Temelleri için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-2","title":"Dürüstlük, Güven ve Finansal İtibar","body":"İtibar, bir kuruluşun sözlerini tutması, hataları açıklaması ve müşterilerine adil davranmasıyla oluşan güvenilirlik algısıdır. İtibar müşteri devamlılığını ve finansmana erişimi etkileyebilir; fakat tek başına sayısal başarıyı açıklamaz.","example":"1.000 müşterinin %80'i kalırsa 800, %60'ı kalırsa 600 müşteri devam eder; fark 200 kişidir.","source":"OECD kurumsal yönetim ilkeleri","homework":"Dürüstlük, Güven ve Finansal İtibar konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Güven nasıl oluşur?","a":"Tutarlı, doğru ve güvenilir davranışlarla.","why":"İtibar, bir kuruluşun sözlerini tutması, hataları açıklaması ve müşterilerine adil davranmasıyla oluşan güvenilirlik algısıdır."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"1.000 müşterinin %80'i kalırsa 800, %60'ı kalırsa 600 müşteri devam eder; fark 200 kişidir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"İtibar, bir kuruluşun sözlerini tutması, hataları açıklaması ve müşterilerine adil davranmasıyla oluşan güvenilirlik algısıdır. İtibar müşteri devamlılığını ve finansmana erişimi etkileyebilir; fakat tek başına sayısal başarıyı açıklamaz."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Dürüstlük, Güven ve Finansal İtibar için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-3","title":"Çıkar Çatışmaları ve Etik Karar Alma","body":"Çıkar çatışması kişisel yararın mesleki yükümlülüğü etkileme riskidir. Açıklama, bağımsız onay ve gerektiğinde karardan çekilme temel araçlardır. Açıklama tek başına her çatışmayı çözmez.","example":"900.000 TL ve 1.050.000 TL teklifin farkı 150.000 TL'dir. Pahalı teklif akrabaya aitse yönetici bağlantısını bildirmelidir.","source":"CFA Institute etik standartları","homework":"Çıkar Çatışmaları ve Etik Karar Alma konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Çıkar çatışması nedir?","a":"Kişisel çıkarın mesleki sorumluluğu etkileyebilmesi.","why":"Çıkar çatışması kişisel yararın mesleki yükümlülüğü etkileme riskidir."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"900.000 TL ve 1.050.000 TL teklifin farkı 150.000 TL'dir. Pahalı teklif akrabaya aitse yönetici bağlantısını bildirmelidir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Çıkar çatışması kişisel yararın mesleki yükümlülüğü etkileme riskidir. Açıklama, bağımsız onay ve gerektiğinde karardan çekilme temel araçlardır. Açıklama tek başına her çatışmayı çözmez."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Çıkar Çatışmaları ve Etik Karar Alma için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-4","title":"Kurumsal Yönetim Nedir?","body":"Kurumsal yönetim şirketin yönlendirilmesi, kontrolü ve hesap verebilirliğini sağlayan yapılardır. Şeffaflık, adillik, sorumluluk ve hesap verebilirlik temel ilkelerdir. Kurulun bağımsızlığı yalnızca sayıdan ibaret değildir.","example":"8 üyeli yönetim kurulunda 3 bağımsız üyenin oranı 3/8 = %37,5'tir.","source":"G20/OECD Principles of Corporate Governance","homework":"Kurumsal Yönetim Nedir? konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Kurumsal yönetim neyi kapsar?","a":"Şirketin yönlendirilmesini, kontrolünü ve hesap verebilirliğini.","why":"Kurumsal yönetim şirketin yönlendirilmesi, kontrolü ve hesap verebilirliğini sağlayan yapılardır."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"8 üyeli yönetim kurulunda 3 bağımsız üyenin oranı 3/8 = %37,5'tir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Kurumsal yönetim şirketin yönlendirilmesi, kontrolü ve hesap verebilirliğini sağlayan yapılardır. Şeffaflık, adillik, sorumluluk ve hesap verebilirlik temel ilkelerdir. Kurulun bağımsızlığı yalnızca sayıdan ibaret değildir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Kurumsal Yönetim Nedir? için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-5","title":"Hissedarlar, Paydaşlar ve Şirketin Sorumlulukları","body":"Hissedar şirketin pay sahibidir; paydaş çalışan, müşteri, tedarikçi, kredi veren ve yerel toplulukları da kapsar. Farklı çıkarlar arasında hukuka uygun, gerekçeli ve uzun vadeli kararlar gerekir.","example":"2 milyon TL yıllık tasarruftan 300.000 TL eğitim ve 200.000 TL güvenlik harcaması çıkarılırsa ilk yıl 1,5 milyon TL kalır.","source":"OECD kurumsal yönetim ilkeleri","homework":"Hissedarlar, Paydaşlar ve Şirketin Sorumlulukları konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Paydaş kimdir?","a":"Şirketten etkilenen veya onu etkileyen kişi ve gruplar.","why":"Hissedar şirketin pay sahibidir; paydaş çalışan, müşteri, tedarikçi, kredi veren ve yerel toplulukları da kapsar."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"2 milyon TL yıllık tasarruftan 300.000 TL eğitim ve 200.000 TL güvenlik harcaması çıkarılırsa ilk yıl 1,5 milyon TL kalır.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Hissedar şirketin pay sahibidir; paydaş çalışan, müşteri, tedarikçi, kredi veren ve yerel toplulukları da kapsar. Farklı çıkarlar arasında hukuka uygun, gerekçeli ve uzun vadeli kararlar gerekir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Hissedarlar, Paydaşlar ve Şirketin Sorumlulukları için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-6","title":"Yönetim Kurulu ve Üst Yönetimin Görevleri","body":"Yönetim kurulu strateji, risk, üst yönetim ve finansal raporlamayı gözetir; günlük operasyonu üst yönetim yürütür. Pozitif net bugünkü değer riskin ortadan kalktığı anlamına gelmez.","example":"Bir yatırımın iyi senaryosu +15 milyon, temel senaryosu +5 milyon, kötü senaryosu −12 milyon TL NPV olabilir; kurul hepsini sorgulamalıdır.","source":"G20/OECD kurumsal yönetim ilkeleri","homework":"Yönetim Kurulu ve Üst Yönetimin Görevleri konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Yönetim kurulu ne yapar?","a":"Strateji, risk ve üst yönetimi gözetir.","why":"Yönetim kurulu strateji, risk, üst yönetim ve finansal raporlamayı gözetir; günlük operasyonu üst yönetim yürütür."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Bir yatırımın iyi senaryosu +15 milyon, temel senaryosu +5 milyon, kötü senaryosu −12 milyon TL NPV olabilir; kurul hepsini sorgulamalıdır.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Yönetim kurulu strateji, risk, üst yönetim ve finansal raporlamayı gözetir; günlük operasyonu üst yönetim yürütür. Pozitif net bugünkü değer riskin ortadan kalktığı anlamına gelmez."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Yönetim Kurulu ve Üst Yönetimin Görevleri için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-7","title":"İç Kontrol, İç Denetim ve Bağımsız Denetim","body":"İç kontrol operasyon, raporlama ve uyum hedeflerini destekler. İç denetim kontrol ve risk süreçlerini değerlendirir; bağımsız denetim finansal tablolara standartlara göre güvence sağlar. Görev ayrılığı hata ve suistimal riskini azaltır.","example":"Tedarikçi açma, fatura kontrolü ve ödeme onayını farklı yetkililere dağıtmak tek kişinin tüm süreci yönetmesini sınırlar.","source":"COSO; IIA; IAASB","homework":"İç Kontrol, İç Denetim ve Bağımsız Denetim konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Görev ayrılığı neden önemlidir?","a":"Tek kişinin tüm işlemi kontrol etmesini sınırlar.","why":"İç kontrol operasyon, raporlama ve uyum hedeflerini destekler."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Tedarikçi açma, fatura kontrolü ve ödeme onayını farklı yetkililere dağıtmak tek kişinin tüm süreci yönetmesini sınırlar.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"İç kontrol operasyon, raporlama ve uyum hedeflerini destekler. İç denetim kontrol ve risk süreçlerini değerlendirir; bağımsız denetim finansal tablolara standartlara göre güvence sağlar. Görev ayrılığı hata ve suistimal riskini azaltır."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"İç Kontrol, İç Denetim ve Bağımsız Denetim için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-8","title":"Finansal Raporlamada Şeffaflık","body":"Şeffaf finansal raporlama önemli olumlu ve olumsuz bilgileri doğru sunar. Gelir artışı kâr artışı demek değildir; muhasebe politikaları ve önemli varsayımlar açıklanmalıdır.","example":"Gelir 100 milyondan 120 milyona çıkarsa %20 artar; net kâr 10 milyondan 6 milyona düşerse %40 azalır.","source":"IFRS Foundation; KGK","homework":"Finansal Raporlamada Şeffaflık konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Şeffaf raporlama nedir?","a":"Önemli olumlu ve olumsuz bilgilerin dengeli sunumu.","why":"Şeffaf finansal raporlama önemli olumlu ve olumsuz bilgileri doğru sunar."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Gelir 100 milyondan 120 milyona çıkarsa %20 artar; net kâr 10 milyondan 6 milyona düşerse %40 azalır.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Şeffaf finansal raporlama önemli olumlu ve olumsuz bilgileri doğru sunar. Gelir artışı kâr artışı demek değildir; muhasebe politikaları ve önemli varsayımlar açıklanmalıdır."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Finansal Raporlamada Şeffaflık için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-9","title":"Piyasa Etiği ve İçeriden Öğrenenlerin Ticareti","body":"Kamuya açıklanmamış önemli bilginin uygunsuz kullanımı ve yanıltıcı piyasa işlemleri piyasa bütünlüğünü bozar. Gizli bilgiyi yakınlara aktarmak da ciddi risk taşır; ilgili uyum kurallarına başvurulmalıdır.","example":"Açıklanmamış önemli satın alma anlaşmasını bilen çalışan, bilgiye dayanarak pay işlemi yapmamalıdır.","source":"SPK sermaye piyasası mevzuatı","homework":"Piyasa Etiği ve İçeriden Öğrenenlerin Ticareti konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"İçsel bilgi neden korunur?","a":"Haksız bilgi avantajı ve piyasa bütünlüğü riski nedeniyle.","why":"Kamuya açıklanmamış önemli bilginin uygunsuz kullanımı ve yanıltıcı piyasa işlemleri piyasa bütünlüğünü bozar."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Açıklanmamış önemli satın alma anlaşmasını bilen çalışan, bilgiye dayanarak pay işlemi yapmamalıdır.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Kamuya açıklanmamış önemli bilginin uygunsuz kullanımı ve yanıltıcı piyasa işlemleri piyasa bütünlüğünü bozar. Gizli bilgiyi yakınlara aktarmak da ciddi risk taşır; ilgili uyum kurallarına başvurulmalıdır."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Piyasa Etiği ve İçeriden Öğrenenlerin Ticareti için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-10","title":"Sürdürülebilir Finans Nedir?","body":"Sürdürülebilir finans, çevresel, sosyal ve yönetişimle ilgili risk ve fırsatları finansal kararlara dahil eder. Yeşil etiketli yatırım risksiz veya garantili getirili değildir.","example":"1 milyon TL enerji verimliliği yatırımı yılda 250.000 TL tasarruf sağlarsa basit geri ödeme 4 yıldır; iskonto dikkate alınmaz.","source":"UNEP FI; OECD","homework":"Sürdürülebilir Finans Nedir? konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Sürdürülebilir finans neyi kapsar?","a":"Finansal kararların çevresel, sosyal ve yönetişim boyutlarını.","why":"Sürdürülebilir finans, çevresel, sosyal ve yönetişimle ilgili risk ve fırsatları finansal kararlara dahil eder."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"1 milyon TL enerji verimliliği yatırımı yılda 250.000 TL tasarruf sağlarsa basit geri ödeme 4 yıldır; iskonto dikkate alınmaz.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Sürdürülebilir finans, çevresel, sosyal ve yönetişimle ilgili risk ve fırsatları finansal kararlara dahil eder. Yeşil etiketli yatırım risksiz veya garantili getirili değildir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Sürdürülebilir Finans Nedir? için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-11","title":"ESG: Çevresel, Sosyal ve Yönetişim Faktörleri","body":"ESG çevresel (E), sosyal (S) ve yönetişim (G) boyutlarıdır. Derecelendirme kuruluşlarının yöntemleri ve ağırlıkları farklıdır. ESG puanı çevresel etkinin doğrudan ölçüsü olmak zorunda değildir.","example":"E=70, S=80, G=60 ise eşit ağırlıklı ortalama 70'tir.","source":"IFRS Foundation; CFA Institute","homework":"ESG: Çevresel, Sosyal ve Yönetişim Faktörleri konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"ESG'nin G'si nedir?","a":"Yönetişim.","why":"ESG çevresel (E), sosyal (S) ve yönetişim (G) boyutlarıdır."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"E=70, S=80, G=60 ise eşit ağırlıklı ortalama 70'tir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"ESG çevresel (E), sosyal (S) ve yönetişim (G) boyutlarıdır. Derecelendirme kuruluşlarının yöntemleri ve ağırlıkları farklıdır. ESG puanı çevresel etkinin doğrudan ölçüsü olmak zorunda değildir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"ESG: Çevresel, Sosyal ve Yönetişim Faktörleri için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-12","title":"İklim Riski ve Finansal Sistem","body":"Fiziksel iklim riskleri sel, kuraklık ve sıcaklık gibi olaylardır; geçiş riskleri düzenleme, teknoloji ve tercih değişimleridir. İkisi de nakit akışı, teminat ve kredi riskini etkileyebilir.","example":"10 milyon TL enerji gideri %20 artarsa 12 milyon TL olur; ek maliyet 2 milyon TL'dir.","source":"NGFS; IFRS S2","homework":"İklim Riski ve Finansal Sistem konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Fiziksel iklim riskine örnek nedir?","a":"Sel veya kuraklık.","why":"Fiziksel iklim riskleri sel, kuraklık ve sıcaklık gibi olaylardır; geçiş riskleri düzenleme, teknoloji ve tercih değişimleridir."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"10 milyon TL enerji gideri %20 artarsa 12 milyon TL olur; ek maliyet 2 milyon TL'dir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Fiziksel iklim riskleri sel, kuraklık ve sıcaklık gibi olaylardır; geçiş riskleri düzenleme, teknoloji ve tercih değişimleridir. İkisi de nakit akışı, teminat ve kredi riskini etkileyebilir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"İklim Riski ve Finansal Sistem için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-13","title":"Karbon Emisyonları ve Karbon Muhasebesi","body":"GHG Protocol'e göre Kapsam 1 doğrudan, Kapsam 2 satın alınan enerjiye ilişkin dolaylı, Kapsam 3 değer zincirindeki diğer dolaylı emisyonları kapsar. Ölçü birimi genellikle ton CO₂e'dir.","example":"500 ton Kapsam 1 + 300 ton Kapsam 2 + 1.200 ton Kapsam 3 = 2.000 ton CO₂e; Kapsam 3 payı %60.","source":"GHG Protocol Corporate Standard","homework":"Karbon Emisyonları ve Karbon Muhasebesi konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Kapsam 1 nedir?","a":"Şirketin doğrudan emisyonları.","why":"GHG Protocol'e göre Kapsam 1 doğrudan, Kapsam 2 satın alınan enerjiye ilişkin dolaylı, Kapsam 3 değer zincirindeki diğer dolaylı emisyonları kapsar."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"500 ton Kapsam 1 + 300 ton Kapsam 2 + 1.200 ton Kapsam 3 = 2.000 ton CO₂e; Kapsam 3 payı %60.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"GHG Protocol'e göre Kapsam 1 doğrudan, Kapsam 2 satın alınan enerjiye ilişkin dolaylı, Kapsam 3 değer zincirindeki diğer dolaylı emisyonları kapsar. Ölçü birimi genellikle ton CO₂e'dir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Karbon Emisyonları ve Karbon Muhasebesi için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-14","title":"Yeşil Tahviller ve Sürdürülebilir Finansman Araçları","body":"Yeşil tahvil fonların uygun yeşil projelere tahsisi amacıyla yapılandırılır. Sürdürülebilirlik bağlantılı tahvillerde performans hedefleri finansal koşullarla bağlantılı olabilir. İhraççının kredi riski devam eder.","example":"100 milyon TL nominal ve yıllık %12 kuponlu varsayımsal tahvilin yıllık kuponu 12 milyon TL'dir.","source":"ICMA Green Bond Principles; SPK","homework":"Yeşil Tahviller ve Sürdürülebilir Finansman Araçları konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Yeşil tahvil risksiz midir?","a":"Hayır, kredi ve piyasa riskleri sürer.","why":"Yeşil tahvil fonların uygun yeşil projelere tahsisi amacıyla yapılandırılır."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"100 milyon TL nominal ve yıllık %12 kuponlu varsayımsal tahvilin yıllık kuponu 12 milyon TL'dir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Yeşil tahvil fonların uygun yeşil projelere tahsisi amacıyla yapılandırılır. Sürdürülebilirlik bağlantılı tahvillerde performans hedefleri finansal koşullarla bağlantılı olabilir. İhraççının kredi riski devam eder."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Yeşil Tahviller ve Sürdürülebilir Finansman Araçları için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-15","title":"Etki Yatırımı ve Sorumlu Yatırım","body":"Etki yatırımı finansal getiri yanında ölçülebilir olumlu sosyal veya çevresel etki amaçlar. Faaliyet çıktısı ile gerçek sonuç ve nedensel etki farklıdır; yatırımın anaparası risk altındadır.","example":"5.000 öğrenciden 3.500'ü eğitimi tamamlarsa tamamlama oranı %70'tir; öğrenme etkisini tek başına kanıtlamaz.","source":"GIIN; UN PRI","homework":"Etki Yatırımı ve Sorumlu Yatırım konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Etki yatırımı neyi amaçlar?","a":"Finansal getiriyle birlikte ölçülebilir olumlu etki.","why":"Etki yatırımı finansal getiri yanında ölçülebilir olumlu sosyal veya çevresel etki amaçlar."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"5.000 öğrenciden 3.500'ü eğitimi tamamlarsa tamamlama oranı %70'tir; öğrenme etkisini tek başına kanıtlamaz.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Etki yatırımı finansal getiri yanında ölçülebilir olumlu sosyal veya çevresel etki amaçlar. Faaliyet çıktısı ile gerçek sonuç ve nedensel etki farklıdır; yatırımın anaparası risk altındadır."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Etki Yatırımı ve Sorumlu Yatırım için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-16","title":"Yeşil Aklama (Greenwashing)","body":"Greenwashing çevresel performansı yanlış, eksik veya belirsiz iddialarla olduğundan iyi göstermektir. Mutlak emisyon ve üretim birimi başına emisyon yoğunluğu farklıdır. İddialar kapsam, dönem ve yöntemle doğrulanmalıdır.","example":"Toplam emisyon 1.000 tondan 1.200 tona çıkarsa %20 artmıştır; yoğunluk düşmüş olsa bile toplam azalmamıştır.","source":"OECD; sürdürülebilirlik açıklama standartları","homework":"Yeşil Aklama (Greenwashing) konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Greenwashing nedir?","a":"Çevresel performansı yanıltıcı biçimde iyi gösterme.","why":"Greenwashing çevresel performansı yanlış, eksik veya belirsiz iddialarla olduğundan iyi göstermektir."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Toplam emisyon 1.000 tondan 1.200 tona çıkarsa %20 artmıştır; yoğunluk düşmüş olsa bile toplam azalmamıştır.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Greenwashing çevresel performansı yanlış, eksik veya belirsiz iddialarla olduğundan iyi göstermektir. Mutlak emisyon ve üretim birimi başına emisyon yoğunluğu farklıdır. İddialar kapsam, dönem ve yöntemle doğrulanmalıdır."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Yeşil Aklama (Greenwashing) için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-17","title":"Sürdürülebilirlik Raporlaması ve IFRS S1–S2","body":"IFRS S1 sürdürülebilirlikle ilgili finansal açıklamaların genel çerçevesini, IFRS S2 iklim açıklamalarını düzenler. Yönetişim, strateji, risk yönetimi, metrikler ve hedefler önemlidir. Türkiye'de TSRS kapsamı güncel KGK düzenlemelerinden kontrol edilir.","example":"Enerji tüketimi 12.000 MWh'den 10.000 MWh'ye düşerse azalma yaklaşık %16,67'dir.","source":"IFRS S1; IFRS S2; KGK TSRS","homework":"Sürdürülebilirlik Raporlaması ve IFRS S1–S2 konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"IFRS S2 neyi düzenler?","a":"İklimle ilgili finansal açıklamaları.","why":"IFRS S1 sürdürülebilirlikle ilgili finansal açıklamaların genel çerçevesini, IFRS S2 iklim açıklamalarını düzenler."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"Enerji tüketimi 12.000 MWh'den 10.000 MWh'ye düşerse azalma yaklaşık %16,67'dir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"IFRS S1 sürdürülebilirlikle ilgili finansal açıklamaların genel çerçevesini, IFRS S2 iklim açıklamalarını düzenler. Yönetişim, strateji, risk yönetimi, metrikler ve hedefler önemlidir. Türkiye'de TSRS kapsamı güncel KGK düzenlemelerinden kontrol edilir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Sürdürülebilirlik Raporlaması ve IFRS S1–S2 için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-18","title":"Etik Liderlik ve Kurumsal Kültür","body":"Etik kültür yalnızca yazılı kurallarla kurulmaz. Lider örnekliği, güvenli bildirim kanalları, misilleme yasağı, gerçekçi hedefler ve adil teşvikler gerekir. Salt satış sayısına odaklanmak yanlış ürün satışını özendirebilir.","example":"100 satışta 20 şikâyet %20; 90 satışta 2 şikâyet yaklaşık %2,22'dir. Müşteri profili de karşılaştırılmalıdır.","source":"OECD; CFA Institute","homework":"Etik Liderlik ve Kurumsal Kültür konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Etik kültür nasıl o , borç azaltma ve diğer kaynak kullanımları arasında seçimdir."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"%10 iskonto oranıyla bir yıl sonraki 1.200.000 TL'nin bugünkü değeri 1.090.909 TL; 1 milyon TL yatırım için NPV yaklaşık 90.909 TL'dir.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Sermaye tahsisi yatırım, borç azaltma ve diğer kaynak kullanımları arasında seçimdir. NPV, iskonto edilmiş nakit akışlarının yatırım maliyetini aşan kısmını ölçer. Etik ve çevresel riskler finansal varsayımları etkileyebilir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Uzun Vadeli Değer Yaratma ve Sorumlu Sermaye Tahsisi için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]},{"id":"stage5-24-20","title":"Finansal Etik ve Sürdürülebilir Finans Bitirme Projesi","body":"Bitirme projesi finansal analiz, etik riskler, yönetim kurulu gözetimi, ESG hedefleri, iklim riskleri, doğrulama ve yatırım değerlendirmesini birleştirir. Gerçekleşen performans hedeflerden ayrı izlenmelidir.","example":"50 milyon gelir − 40 milyon gider = 10 milyon TL fark; 8 milyon yatırım / 2 milyon yıllık tasarruf = 4 yıl basit geri ödeme; 3/7 bağımsız üye yaklaşık %42,86.","source":"CFA Institute; OECD; IFRS; KGK; SPK; GHG Protocol","homework":"Finansal Etik ve Sürdürülebilir Finans Bitirme Projesi konusunda bir uygulama planı yaz: temel kavramı tanımla, sayısal örneği kontrol et, iki risk ve iki kontrol öner.","note":"Bu konuyu kendi finansal kararlarımda nasıl uygularım?","quiz":[{"q":"Bitirme projesinde ne değerlendirilir?","a":"Finansal değer, etik riskler ve sürdürülebilirlik hedefleri.","why":"Bitirme projesi finansal analiz, etik riskler, yönetim kurulu gözetimi, ESG hedefleri, iklim riskleri, doğrulama ve yatırım değerlendirmesini birleştirir."},{"q":"Bu dersteki sayısal örnek hangi sonuca ulaşır?","a":"50 milyon gelir − 40 milyon gider = 10 milyon TL fark; 8 milyon yatırım / 2 milyon yıllık tasarruf = 4 yıl basit geri ödeme; 3/7 bağımsız üye yaklaşık %42,86.","why":"Verilen varsayımlarla örnekteki işlemi yeniden hesapla."},{"q":"Bu konudaki temel risk veya sınırlama nedir?","a":"Tek bir gösterge veya iddia tek başına yeterli değildir; bağlam ve riskler incelenmelidir.","why":"Bitirme projesi finansal analiz, etik riskler, yönetim kurulu gözetimi, ESG hedefleri, iklim riskleri, doğrulama ve yatırım değerlendirmesini birleştirir. Gerçekleşen performans hedeflerden ayrı izlenmelidir."},{"q":"Karar öncesi hangi doğrulama yapılmalıdır?","a":"Kaynak, varsayım, ilgili mevzuat ve karşılaştırmalı veriler kontrol edilmelidir.","why":"Doğrulama yanıltıcı karar riskini azaltır."},{"q":"Konuyla ilgili uygulamalı çalışma nasıl yapılır?","a":"Finansal Etik ve Sürdürülebilir Finans Bitirme Projesi için örnek olay, riskler ve kontrol adımları yazılır.","why":"Bilgiyi gerçek karar sürecine taşımak öğrenmeyi pekiştirir."}]}];const key=id=>'fin24-'+id;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const root=document.getElementById('lessons');function render(){root.innerHTML=data.map((l,i)=>{let state=JSON.parse(localStorage.getItem(key(l.id))||'{}');return '<article id="'+l.id+'"><h2>Ders '+(i+1)+'/20 — '+esc(l.title)+'</h2><h3>Konu anlatımı</h3><p>'+esc(l.body)+'</p><h3>Çözümlü örnek</h3><p>'+esc(l.example)+'</p><h3>5 açıklamalı soru</h3>'+l.quiz.map((q,j)=>'<details><summary>'+(j+1)+'. '+esc(q.q)+'</summary><p><strong>Cevap:</strong> '+esc(q.a)+'</p><p><strong>Açıklama:</strong> '+esc(q.why)+'</p></details>').join('')+'<h3>Ödev</h3><p>'+esc(l.homework)+'</p><h3>Kişisel not</h3><p>'+esc(l.note)+'</p><textarea aria-label="Kişisel not ve ödev" id="note-'+l.id+'" placeholder="Ödev ve kişisel notlarını buraya yaz...">'+esc(state.note||'')+'</textarea><p><strong>Özet:</strong> '+esc(l.body.split('.').slice(0,2).join('.')+'.')+'</p><p><small>Kaynak: '+esc(l.source)+'</small></p><button onclick="save(\''+l.id+'\')">Notumu kaydet</button><button class="primary" onclick="complete(\''+l.id+'\')">'+(state.done?'✓ Tamamlandı':'Dersi tamamla')+'</button></article>'}).join('');progress()}function save(id){let old=JSON.parse(localStorage.getItem(key(id))||'{}');old.note=document.getElementById('note-'+id).value;localStorage.setItem(key(id),JSON.stringify(old));alert('Bu cihazda kaydedildi.')}function complete(id){save(id);let old=JSON.parse(localStorage.getItem(key(id))||'{}');old.done=true;localStorage.setItem(key(id),JSON.stringify(old));render()}function progress(){let n=data.filter(l=>JSON.parse(localStorage.getItem(key(l.id))||'{}').done).length;document.getElementById('progress').textContent='Bu cihazda tamamlanan: '+n+'/20'}render();</script></body></html>
